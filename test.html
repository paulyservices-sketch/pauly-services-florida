<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pauly Services Florida — Coming Fall 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a1628;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #112240;
      border: 1px solid #1e3a6e;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 40px rgba(30, 90, 180, 0.2);
    }
    .badge {
      display: inline-block;
      background: #1e3a6e;
      color: #64b5f6;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    h1 span { color: #64b5f6; }
    p.tagline {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .divider {
      border: none;
      border-top: 1px solid #1e3a6e;
      margin: 1.75rem 0;
    }
    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1rem;
      color: #e2e8f0;
    }
    .contact-item a {
      color: #64b5f6;
      text-decoration: none;
    }
    .contact-item a:hover { text-decoration: underline; }
    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Coming Fall 2026</div>
    <h1>Pauly Services<br/><span>Florida</span></h1>
    <p class="tagline">
      Professional drain cleaning specialists expanding to Central Florida —
      serving Volusia, Flagler, Marion &amp; St. Johns County.
      Flat-rate pricing. No hidden fees.
    </p>
    <hr class="divider" />
    <div class="contact-grid">
      <div class="contact-item">
        📞 <a href="tel:+18104795806">(810) 479-5806</a>
      </div>
      <div class="contact-item">
        ✉️ <a href="mailto:paulyservices@gmail.com">paulyservices@gmail.com</a>
      </div>
    </div>
    <p class="footer">Built by Ron — Pauly Services Swarm Agent</p>
  </div>
</body>
</html>
